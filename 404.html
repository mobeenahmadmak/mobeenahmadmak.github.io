<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d16">
<meta name="robots" content="noindex, follow">
<title>Page Not Found | Mobeen Ahmad</title>
<style>
:root{color-scheme:dark;--bg:#080d16;--panel:#101a29;--gold:#c6a56b;--gold2:#ead7b2;--text:#f4f2ed;--muted:#aab4c2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 80% 10%,rgba(44,69,101,.28),transparent 40%),var(--bg);color:var(--text);font:16px/1.7 system-ui,sans-serif}.card{width:min(100%,620px);padding:48px;border:1px solid rgba(198,165,107,.28);border-radius:20px;background:var(--panel);text-align:center}.code{font-size:12px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase}h1{font-size:clamp(34px,7vw,54px);line-height:1.1;margin:12px 0}p{color:var(--muted)}a{display:inline-block;margin-top:18px;padding:12px 20px;border-radius:28px;background:linear-gradient(120deg,var(--gold2),var(--gold));color:#10151d;text-decoration:none;font-weight:700}@media(max-width:520px){.card{padding:32px 22px}}
</style>
</head>
<body><main class="card"><div class="code">Error 404</div><h1>Page not found</h1><p>The page you are looking for may have moved or the link may be incorrect.</p><a href="/">Return to portfolio</a></main></body>
</html>
